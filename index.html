<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101522"><title>Capo</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color-scheme:dark;background:#101522;color:#f5f7fc}*{box-sizing:border-box}html,body{margin:0;min-height:100%;}main{width:100%;max-width:520px;margin:auto;padding:calc(8px + env(safe-area-inset-top)) 12px calc(8px + env(safe-area-inset-bottom));height:100dvh;display:flex;flex-direction:column;min-height:0}header{display:flex;align-items:center;justify-content:space-between;flex:0 0 34px;margin-bottom:7px}h1{font-size:21px;letter-spacing:-1px;margin:0;font-weight:800}h1 span{color:#64d6a5}.clear{background:none;border:0;color:#a8b5ca;font-size:13px;padding:8px;cursor:pointer}label{display:block;font-size:12px;color:#b0bfd6;margin-bottom:5px}textarea{width:100%;height:clamp(66px,17dvh,110px);flex:none;resize:none;border-radius:12px;border:1px solid #354159;background:#1a2335;color:#fff;padding:12px;font:18px/1.35 system-ui;outline:none}textarea:focus{border-color:#6fd7a9}.head{display:flex;align-items:center;justify-content:space-between;margin:13px 0 8px;flex:none}.head h2{font-size:14px;margin:0;font-weight:650}.muted{font-size:11px;color:#8d9cb5}#results{display:flex;flex-direction:column;gap:8px;min-height:0;flex:1}.card{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:8px;align-items:center;background:#1a2335;border:1px solid #354159;border-radius:12px;padding:10px;min-height:0;flex:1}.best{border-color:#508f79;background:#192b2a}.fret{font-weight:750;font-size:15px}.tag{display:block;color:#79d9ac;font-size:10px;font-weight:550;margin-top:3px}.chords{font-size:clamp(14px,4vw,18px);line-height:1.35;overflow-wrap:anywhere;font-weight:550}.copy{border:1px solid #42516b;border-radius:8px;padding:8px;background:#29374e;color:#f6f8ff;font-size:12px;font-weight:650;cursor:pointer}#error{color:#ffb7b7;font-size:12px;margin-top:4px}footer{display:none}@media(max-height:420px){textarea{height:54px}.head{margin:6px 0}.card{padding:5px}.copy{padding:5px}}@media(min-width:700px){main{height:min(100dvh,740px);padding-top:20px}}
</style></head><body><main><header><h1>capo<span>.</span></h1><button class="clear" id="clear" type="button">Clear</button></header><label for="input">Chords</label><textarea id="input" spellcheck="false" autocapitalize="off" placeholder="Paste chords here">F#m D A E</textarea><div id="error"></div><div class="head"><h2>Capo options</h2><span class="muted">Same pitch</span></div><div id="results"></div></main><script>
(function(){
const names=['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const alias={'Db':'C#','D#':'Eb','Gb':'F#','G#':'Ab','A#':'Bb','Cb':'B','B#':'C','E#':'F','Fb':'E'};
const easy=new Set(['C','D','Dm','E','Em','G','A','Am','A7','D7','E7','G7','Cmaj7','Am7','Em7','Dsus4','Asus2','B7','Dmaj7','Amaj7','Cadd9','G6','Eadd9']);
const medium=new Set(['Fmaj7','Bm7','F#m7','C#m7','G#m7','C7','Fadd9','B','Bm','F']);
const input=document.getElementById('input'),out=document.getElementById('results'),err=document.getElementById('error');
function shiftRoot(n,delta){let i=names.indexOf(alias[n]||n);return i<0?n:names[(i+delta%12+12)%12]}
function shiftChord(ch,delta){return ch.replace(/^([A-G](?:#|b)?)([^/]*)(?:\/([A-G](?:#|b)?))?$/,(_,root,suffix,bass)=>shiftRoot(root,delta)+suffix+(bass?'/'+shiftRoot(bass,delta):''))}
function score(c){if(easy.has(c))return 0;if(medium.has(c))return 2;return 5}
function render(){
const tokens=input.value.trim().split(/[\s,|]+/).filter(Boolean);
const valid=tokens.filter(x=>/^[A-G](?:#|b)?(?:m|maj|min|dim|aug|sus|add|M)?[0-9#b+()a-zA-Z]*(?:\/[A-G](?:#|b)?)?$/.test(x));
err.textContent=tokens.length!==valid.length?'Unrecognised: '+tokens.filter(x=>!valid.includes(x)).join(', '):'';
out.replaceChildren();if(!valid.length)return;
const opts=Array.from({length:12},(_,capo)=>{const chords=valid.map(x=>shiftChord(x,-capo));return {capo,chords,score:chords.reduce((n,c)=>n+score(c),0)+capo*.16}}).sort((a,b)=>a.score-b.score).slice(0,3);
opts.forEach((o,i)=>{const card=document.createElement('div');card.className='card'+(i===0?' best':'');const fret=document.createElement('div');fret.className='fret';fret.textContent='Capo '+o.capo;if(i===0){const tag=document.createElement('span');tag.className='tag';tag.textContent='Best fit';fret.appendChild(tag)}const chords=document.createElement('div');chords.className='chords';chords.textContent=o.chords.join(' · ');const btn=document.createElement('button');btn.className='copy';btn.textContent='Copy';btn.addEventListener('click',async()=>{try{await navigator.clipboard.writeText('Capo '+o.capo+': '+o.chords.join(' '));btn.textContent='Copied'}catch(e){btn.textContent='Select text'}setTimeout(()=>btn.textContent='Copy',1500)});card.append(fret,chords,btn);out.appendChild(card)});
}
input.addEventListener('input',render);render();
})();
</script><script>document.getElementById('clear').addEventListener('click',()=>{const x=document.getElementById('input');x.value='';x.dispatchEvent(new Event('input'));x.focus()})</script></body></html>
